[workspace]
members = [
  "crates/xac-core",
  "crates/xac-sim",
  "crates/xac-wasm",
  "src-tauri"
]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
